# Local dev / demo stack: LiteLLM proxy (with MLflow tracing) + MLflow + Postgres.
#
# The judge (and app-under-test) run on Groq for dev, so this whole stack needs
# only a GROQ_API_KEY — no local GPU, no OpenAI/Anthropic keys required.
#
#   cp .env.example .env   # then put your GROQ_API_KEY in it
#   docker compose up -d
#   - LiteLLM proxy : http://localhost:4000
#   - MLflow UI      : http://localhost:5000  (Traces tab)
#
# For PRODUCTION the infra team runs the OSS judge (vLLM/Ollama/TGI) separately and
# points the `judge` entry in litellm_config.yaml at it — see that file.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - pgdata:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    depends_on: [postgres]
    command: >
      sh -c "pip install psycopg2-binary &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
             --artifacts-destination /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts

  litellm:
    build:
      context: .
      dockerfile: Dockerfile        # LiteLLM + mlflow>=3.1.4
    depends_on: [mlflow]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    environment:
      # --- MLflow tracing target (self-hosted) ---
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: litellm-proxy-dev
      # --- Judge + app model provider (dev) ---
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro

volumes:
  pgdata:
  mlflow-artifacts:
