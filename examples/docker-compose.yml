# Minimal stack: LiteLLM proxy (with MLflow tracing) + MLflow server + Postgres.
#
# Not shown: the OSS judge server (vLLM/Ollama/TGI). Run it separately and make it
# reachable at the api_base in litellm_config.yaml (e.g. http://vllm:8000/v1).
#
#   docker compose up -d
#   - LiteLLM proxy : http://localhost:4000
#   - MLflow UI      : http://localhost:5000  (Traces tab)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - pgdata:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    depends_on: [postgres]
    command: >
      sh -c "pip install psycopg2-binary &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
             --artifacts-destination /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts

  litellm:
    build:
      context: .
      dockerfile: Dockerfile        # LiteLLM + mlflow>=3.1.4
    depends_on: [mlflow]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    environment:
      # --- MLflow tracing target (self-hosted) ---
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: litellm-proxy-prod
      # --- Provider keys for app traffic ---
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro

volumes:
  pgdata:
  mlflow-artifacts:
