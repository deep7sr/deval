# Self-contained guardrail test stack, now with its own Postgres so LiteLLM's
# DB-backed features (guardrails list, admin UI, spend logs) work and the stack
# mirrors production.
#
# The proxy is on host port 4001 so it does not collide with any existing proxy
# on 4000. Postgres is internal to this compose network only (no host port), so
# it cannot clash with any other database on the machine.
#
#   cd deploy
#   cp .env.example .env      # set your real GROQ_API_KEY (DB creds have defaults)
#   docker compose up --build
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmproxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmproxy_pw}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    volumes:
      - guardrail_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmproxy} -d ${POSTGRES_DB:-litellm}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  litellm-guardrail:
    build:
      context: .
      dockerfile: Dockerfile
    image: litellm-hallucination-guardrail:local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4001:4000"
    env_file:
      - .env
    environment:
      # Guardrail package lives at /app/guardrail (mounted below); make it
      # importable as a package.
      PYTHONPATH: /app
      # Avoid DeepEval telemetry calls (noise / SSL) from inside the container.
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      # LiteLLM connects to Postgres via this (prisma migrations run on boot).
      DATABASE_URL: postgresql://${POSTGRES_USER:-llmproxy}:${POSTGRES_PASSWORD:-llmproxy_pw}@postgres:5432/${POSTGRES_DB:-litellm}
    volumes:
      # The guardrail package (from the repo) -> where litellm's loader looks.
      - ../guardrail:/app/guardrail:ro
      # The config file itself.
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped

  # Non-technical browser demo: generates answers through the proxy above and
  # reveals the real faithfulness score/verdict. Open http://localhost:8090
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: litellm-hallucination-guardrail:local
    depends_on:
      - litellm-guardrail
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      DEMO_PROXY_BASE_URL: http://litellm-guardrail:4000
      DEMO_PROXY_KEY: sk-123
      DEMO_MODEL: groq-test-model
    volumes:
      - ../guardrail:/app/guardrail:ro
      - ../demo:/app/demo:ro
    entrypoint: ["/app/.venv/bin/python", "-m", "uvicorn", "demo.app:app", "--host", "0.0.0.0", "--port", "8090"]
    restart: unless-stopped

volumes:
  guardrail_pgdata:
