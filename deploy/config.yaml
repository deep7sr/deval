# LiteLLM config for validating the hallucination guardrail.
# Includes a Postgres connection (via DATABASE_URL) so the DB-backed management
# endpoints and admin UI work. No MLflow here - the infra team layers callbacks
# etc. back on when promoting to the production proxy.

model_list:
  # The model client requests go to (and that retries are routed back to).
  - model_name: groq-test-model
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  # The judge model. NOTE: the guardrail actually invokes the judge via the
  # litellm SDK directly (see guardrail/groq_judge.py), not through this proxy
  # entry - it is listed here only for documentation / manual testing.
  - model_name: judge-model
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

litellm_settings:
  ssl_verify: false     # corporate SSL interception (matches the prod proxy)
  modify_params: true
  stream: false         # the guardrail only blocks non-streaming responses

guardrails:
  - guardrail_name: "hallucination-guardrail"
    litellm_params:
      # Resolved by litellm's get_instance_fn relative to this config file's
      # directory: <dir>/guardrail/hook.py -> class HallucinationGuardrail.
      # Requires the guardrail package mounted at /app/guardrail and /app on
      # PYTHONPATH (see Dockerfile / docker-compose.yml).
      guardrail: guardrail.hook.HallucinationGuardrail
      mode: "post_call"
      # default_on: false -> this guardrail runs ONLY when a request explicitly
      # opts in by passing "guardrails": ["hallucination-guardrail"] in the body.
      # This is what lets the demo invoke one guardrail at a time (nothing runs
      # on a request that names no guardrail). Per-KEY attachment (infra enables
      # it on a team's virtual key) is a LiteLLM ENTERPRISE feature; per-request
      # body opt-in works on open-source.
      default_on: false

  # Answer Relevancy guardrail. A completely SEPARATE guardrail with its own
  # identity and config namespace (GUARDRAIL_ANSWER_RELEVANCY_*). It needs no
  # evidence marker / retrieval context - it runs on any Q&A request and checks
  # whether the answer actually addresses the question. Enable it independently
  # of the faithfulness guardrail (a team can have one, both, or neither).
  - guardrail_name: "answer-relevancy-guardrail"
    litellm_params:
      # Resolved by litellm's get_instance_fn relative to this config file's
      # directory: <dir>/guardrail/relevancy_hook.py -> AnswerRelevancyGuardrail.
      guardrail: guardrail.relevancy_hook.AnswerRelevancyGuardrail
      mode: "post_call"
      # Opt-in per request: "guardrails": ["answer-relevancy-guardrail"].
      default_on: false

  # Contextual Relevancy guardrail. Grades the RETRIEVER (is the retrieved
  # context relevant to the question?), not the answer - so it REQUIRES the
  # evidence marker like faithfulness, and has NO remediation (re-prompting
  # can't fix retrieval). Default mode is block; set
  # GUARDRAIL_CONTEXTUAL_RELEVANCY_MODE=observe for a log-only retrieval-quality
  # signal. Independent identity / namespace (GUARDRAIL_CONTEXTUAL_RELEVANCY_*).
  - guardrail_name: "contextual-relevancy-guardrail"
    litellm_params:
      # <dir>/guardrail/contextual_relevancy_hook.py -> ContextualRelevancyGuardrail
      guardrail: guardrail.contextual_relevancy_hook.ContextualRelevancyGuardrail
      mode: "post_call"
      # Opt-in per request: "guardrails": ["contextual-relevancy-guardrail"].
      default_on: false

general_settings:
  master_key: sk-123
  # DB connection comes from the DATABASE_URL env var (set in docker-compose.yml),
  # which enables the management endpoints (/guardrails/list, admin UI) and
  # spend logging - mirroring the production proxy.
  store_model_in_db: true
  store_prompts_in_spend_logs: true
